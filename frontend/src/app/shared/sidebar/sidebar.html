<aside class="sidebar">
  <div class="sidebar-header">
    <h3>Filtros</h3>
    <button class="clear-btn" (click)="clearFilters()">Limpiar</button>
  </div>

  <div class="filter-group">
    <label>Género</label>
    <select [(ngModel)]="filters.genre" name="genre"
        (change)="onSelectChange()">
     <option value="">Todos</option>
     <option *ngFor="let g of genres" [value]="g">{{ g }}</option>
   </select>
  </div>

  <div class="filter-group">
    <label>Condición</label>
    <div class="radio-group">
      <label class="radio-option">
        <input type="radio" [(ngModel)]="filters.condition" name="condition"
               value="" (ngModelChange)="onSelectChange()" />
        Todos
      </label>
      <label class="radio-option">
        <input type="radio" [(ngModel)]="filters.condition" name="condition"
               value="new" (ngModelChange)="onSelectChange()" />
        Nuevo
      </label>
      <label class="radio-option">
        <input type="radio" [(ngModel)]="filters.condition" name="condition"
               value="used" (ngModelChange)="onSelectChange()" />
        Usado
      </label>
    </div>
  </div>

  <div class="filter-group">
    <label>Precio</label>
    <div class="price-range">
      <input type="number" [(ngModel)]="filters.minPrice" name="minPrice"
             placeholder="Mín" min="0" (ngModelChange)="onPriceChange()" />
      <span>—</span>
      <input type="number" [(ngModel)]="filters.maxPrice" name="maxPrice"
             placeholder="Máx" min="0" (ngModelChange)="onPriceChange()" />
    </div>
  </div>
</aside>
