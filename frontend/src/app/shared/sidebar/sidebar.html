<aside class="sidebar">

  <!-- Header -->
  <div class="sidebar-header">
    <h3 class="sidebar-title">Filtros</h3>
    <button class="clear-btn" *ngIf="hasActiveFilters" (click)="clearFilters()">Limpiar</button>
  </div>

  <!-- ── Categorías ─────────────────────────────── -->
  <div class="filter-section">
    <button class="section-toggle" (click)="toggleSection('categories')">
      <span>Categorías</span>
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <polyline *ngIf="sections.categories"  points="18 15 12 9 6 15"/>
        <polyline *ngIf="!sections.categories" points="6 9 12 15 18 9"/>
      </svg>
    </button>
    <div class="section-body" [class.section-body-open]="sections.categories">
      <button class="genre-item"
              *ngFor="let g of visibleGenres"
              [class.genre-item-active]="filters.genre === g"
              (click)="selectGenre(g)">
        <span class="genre-dot" [class.genre-dot-active]="filters.genre === g"></span>
        {{ g }}
      </button>
      <button class="see-all-btn" (click)="showAllGenres = !showAllGenres">
        {{ showAllGenres ? '← Ver menos' : 'Ver todos →' }}
      </button>
    </div>
  </div>

  <!-- ── Precio ─────────────────────────────────── -->
  <div class="filter-section">
    <button class="section-toggle" (click)="toggleSection('price')">
      <span>Rango de precio</span>
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <polyline *ngIf="sections.price"  points="18 15 12 9 6 15"/>
        <polyline *ngIf="!sections.price" points="6 9 12 15 18 9"/>
      </svg>
    </button>
    <div class="section-body" [class.section-body-open]="sections.price">
      <div class="price-inputs">
        <div class="price-input-group">
          <label class="price-input-label">Mínimo</label>
          <input class="price-input"
                 type="text"
                 inputmode="numeric"
                 placeholder="$0"
                 [value]="minPriceInput"
                 (input)="onMinPriceInput($event)" />
        </div>
        <span class="price-input-sep">—</span>
        <div class="price-input-group">
          <label class="price-input-label">Máximo</label>
          <input class="price-input"
                 type="text"
                 inputmode="numeric"
                 placeholder="$500.000"
                 [value]="maxPriceInput"
                 (input)="onMaxPriceInput($event)" />
        </div>
      </div>
      <div class="slider-wrap">
        <input class="price-slider"
               type="range"
               min="5000"
               max="500000"
               step="5000"
               [(ngModel)]="maxPriceSlider"
               (ngModelChange)="onSliderChange()"
               [style.--fill]="sliderPercent + '%'" />
        <div class="price-range-labels">
          <span>$5.000</span>
          <span>Hasta {{ formatPrice(maxPriceSlider) }}</span>
        </div>
      </div>
    </div>
  </div>

  <!-- ── Condición ──────────────────────────────── -->
  <div class="filter-section">
    <button class="section-toggle" (click)="toggleSection('condition')">
      <span>Condición</span>
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <polyline *ngIf="sections.condition"  points="18 15 12 9 6 15"/>
        <polyline *ngIf="!sections.condition" points="6 9 12 15 18 9"/>
      </svg>
    </button>
    <div class="section-body" [class.section-body-open]="sections.condition">
      <label class="radio-option">
        <input type="radio" [(ngModel)]="filters.condition" (ngModelChange)="onConditionChange()" name="condition" value="" />
        <span class="radio-custom"></span>
        Todos
      </label>
      <label class="radio-option">
        <input type="radio" [(ngModel)]="filters.condition" (ngModelChange)="onConditionChange()" name="condition" value="new" />
        <span class="radio-custom"></span>
        Nuevo
      </label>
      <label class="radio-option">
        <input type="radio" [(ngModel)]="filters.condition" (ngModelChange)="onConditionChange()" name="condition" value="used" />
        <span class="radio-custom"></span>
        Usado
      </label>
    </div>
  </div>

</aside>
